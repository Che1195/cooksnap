name: CI

on:
  push:
    branches: [main]
  # Draft PRs trigger a run whose jobs all skip (see each job's `if`), so
  # pushes to a draft cost no minutes. Marking the PR ready
  # (`ready_for_review`) runs every job on its current head.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  checks:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
